name: Check tag ruleset

on:
  workflow_dispatch:
    inputs:
      historical_commit:
        description: Commit before this workflow existed
        required: true
        type: string
      alternate_commit:
        description: Different commit for the retarget probe
        required: true
        type: string
      protected_tag:
        description: Existing temporary protected tag to update and delete
        required: true
        type: string

permissions:
  contents: write

jobs:
  probes:
    runs-on: ubuntu-latest
    steps:
      - name: Try all three protected operations
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          HISTORICAL_COMMIT: ${{ inputs.historical_commit }}
          ALTERNATE_COMMIT: ${{ inputs.alternate_commit }}
          PROTECTED_TAG: ${{ inputs.protected_tag }}
        run: |
          set -euo pipefail
          gh auth setup-git
          gh repo clone "$REPOSITORY" checkout
          git -C checkout config user.name "ruleset probe"
          git -C checkout config user.email "ruleset-probe@example.invalid"

          attempt_denied() {
            name="$1"
            shift
            set +e
            response="$("$@" 2>&1)"
            status=$?
            set -e
            printf '%s exit=%s response=%s\n' "$name" "$status" "$response" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$status" -eq 0 ]; then
              echo "$name unexpectedly succeeded" >&2
              exit 1
            fi
          }

          create_tag="v-preauthorize-$RUN_ID"
          git -C checkout tag -a "$create_tag" "$HISTORICAL_COMMIT" -m "ruleset probe"
          attempt_denied create \
            git -C checkout push origin "refs/tags/$create_tag"

          attempt_denied update \
            gh api \
            "repos/$REPOSITORY/git/refs/tags/$PROTECTED_TAG" \
            --method PATCH -f "sha=$ALTERNATE_COMMIT" -F force=true

          attempt_denied delete \
            gh api \
            "repos/$REPOSITORY/git/refs/tags/$PROTECTED_TAG" \
            --method DELETE

          if gh api "repos/$REPOSITORY/git/ref/tags/$create_tag" >/dev/null 2>&1; then
            echo 'the denied creation left a ref behind' >&2
            exit 1
          fi
          gh api "repos/$REPOSITORY/git/ref/tags/$PROTECTED_TAG" \
            --jq '.object.sha' | grep -Fx "$HISTORICAL_COMMIT"
